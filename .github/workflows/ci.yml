name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # =========================
  # CI - FRONTEND
  # =========================
  build-client:
    name: Build Frontend Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Client App
        working-directory: client
        run: npm run build

  # =========================
  # CI - BACKEND
  # =========================
  build-server:
    name: Validate Backend Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

  # =========================
  # CD - DOCKER + RENDER
  # =========================
  docker-build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    needs:
      - build-client
      - build-server

    # Deploy only when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------
      # Docker Hub Login
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------
      # Build & Push Client
      # -------------------------
      - name: Build Client Docker Image
        run: |
          docker build \
            -f docker/Dockerfile.client \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/chat_client:latest \
            .

      - name: Push Client Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/chat_client:latest

      # -------------------------
      # Build & Push Server
      # -------------------------
      - name: Build Server Docker Image
        run: |
          docker build \
            -f docker/Dockerfile.server \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/chat_server:latest \
            .

      - name: Push Server Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/chat_server:latest

      # -------------------------
      # Deploy Client to Render
      # -------------------------
      - name: Deploy Client to Render
        run: |
          curl -X POST "${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}"

      # -------------------------
      # Deploy Server to Render
      # -------------------------
      - name: Deploy Server to Render
        run: |
          curl -X POST "${{ secrets.RENDER_SERVER_DEPLOY_HOOK }}"
